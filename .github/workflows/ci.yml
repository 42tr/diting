# 推送到任意分支或发起 PR 时运行 Rust 与前端测试。
# webrtc-sys 的构建要求与 release.yml 相同(clang >= 21 + glib 头文件)。
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-21 and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev
          wget -qO /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /etc/apt/keyrings/llvm-archive-keyring.gpg /tmp/llvm.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend tests
        run: node --test tests/frontend.test.cjs
