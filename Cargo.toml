[package]
name = "diting"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
utoipa = { version = "5", features = ["macros"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
livekit = "0.7.52"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# crates.io 上 livekit 各 crate 版本互相对不齐(详见 vendor/PATCHES.md),
# 以下为打过兼容补丁的 vendored 副本;官方发布对齐版本后可删除本节并升级。
[patch.crates-io]
livekit = { path = "vendor/livekit-0.7.52" }
livekit-api = { path = "vendor/livekit-api-0.5.6" }
libwebrtc = { path = "vendor/libwebrtc-0.3.43" }
