    "dep:reqwest",
    "dep:tokio",
    "tokio/time",
    "dep:livekit-runtime",
    "livekit-runtime/tokio",
]
signal-client-async = [
    "__signal-client-async-compatible",
    "livekit-runtime/async",
]
